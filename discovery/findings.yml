# Находки по интервью. Проведено одно интервью (interviews/01-maksim.md),
# поэтому все доказанные находки опираются на слова одного человека —
# это прямо указано в каждом claim.
#
# Что удивило (противоречит исходной идее):
# - Я думал, что главная боль — время и дедлайн. Отчёт ни разу не сдавался позже
#   срока; сильнее болит полнота: пропуски замечает руководитель (missed-tasks).
# - Git назван источником данных, но в пошаговом рассказе про последний раз его нет:
#   код смотрят через задачи Jira, а не через git напрямую.
# - Готового инструмента человек не искал как продукт — искал API, чтобы
#   автоматизировать самому (no-known-tool).

findings:
  - id: manual-multi-source
    claim: |
      Отчёт за месяц собирают вручную, последовательно обходя несколько систем:
      задачи в Jira, код в задачах, релизы, корпоративный календарь.
      Единичный случай (одно интервью); со слов собеседника, так же делают коллеги.
    evidence:
      - source: interviews/01-maksim.md
        quote: Сначала я зашел в трекер задач Jira и вывел статистику по тем задачам, которые я сделал за предыдущий месяц
      - source: interviews/01-maksim.md
        quote: Затем я зашел в корпоративный календарь для того, чтобы посмотреть те встречи и митинги
      - source: interviews/01-maksim.md
        quote: Все коллеги-разработчики из моей команды собирают аналогичные отчеты

  - id: context-switching
    claim: |
      Главная точка, где сборка отчёта тормозит, — переключение между источниками
      на каждом шаге. Единичный случай (одно интервью).
    evidence:
      - source: interviews/01-maksim.md
        quote: так как приходится переключаться между множеством источников данных

  - id: missed-tasks
    claim: |
      Отчёт получается неполным: задачи, в которых человек работал, но которые не попали
      в выгрузку из Jira, теряются, и о части пропусков он узнаёт от руководителя уже
      после отправки. Единичный случай (одно интервью).
    evidence:
      - source: interviews/01-maksim.md
        quote: я вспомнил, что не дописал туда одну из задач, с которой я занимался, но которая не попала в выгрузку задач из Жиры
      - source: interviews/01-maksim.md
        quote: О них я узнал от непосредственного руководителя, который участвовал в выполнении этих задач

  - id: messenger-only-meetings
    claim: |
      Часть встреч не попадает в календарь: спонтанные созвоны остаются только в
      корпоративном мессенджере, и их дописывают в отчёт задним числом.
      Единичный случай (одно интервью).
    evidence:
      - source: interviews/01-maksim.md
        quote: дописал пару спонтанных встреч, которые не были зафиксированы в моем календаре
      - source: interviews/01-maksim.md
        quote: отсылки на них были только в корпоративном мессенджере

  - id: monthly-time-cost
    claim: |
      Сборка отчёта занимает около двух часов, а с правками и уточнениями — 4–5 часов
      в месяц; час работы собеседник оценивает примерно в 5000 ₽.
      Единичный случай (одно интервью).
    evidence:
      - source: interviews/01-maksim.md
        quote: Времени это занимает около 2 часов, как в этот раз, так и в прошлый раз
      - source: interviews/01-maksim.md
        quote: В сумме, где-то часа 4-5 в месяц
      - source: interviews/01-maksim.md
        quote: 1 час, порядка 5 тысяч рублей

  - id: no-known-tool
    claim: |
      Готовым инструментом не пользуются и за него не платят: собеседник не знает о его
      существовании и пытался искать способ автоматизации через API систем.
      Единичный случай (одно интервью).
    evidence:
      - source: interviews/01-maksim.md
        quote: Пробовал собирать только вручную, так как не знаю, как это автоматизировать
      - source: interviews/01-maksim.md
        quote: не уверен, что такой инструмент существует
      - source: interviews/01-maksim.md
        quote: Гуглил различные команды по интеграции с Jira API, API календаря и API корпоративного мессенджера

  - id: completeness-is-quality
    claim: |
      Качество отчёта собеседник оценивает по полноте, а не по оформлению; руководитель
      задаёт уточняющие вопросы прежде всего по задачам, в постановке которых участвовал.
      Единичный случай (одно интервью).
    evidence:
      - source: interviews/01-maksim.md
        quote: по полноте данных из разных источников. Если ничего не упустил, то, значит, всё хорошо
      - source: interviews/01-maksim.md
        quote: иногда бывают уточняющие вопросы по задачам или правки

  - id: corporate-api-restrictions
    basis: assumption
    claim: |
      В банке доступ сторонних инструментов к API корпоративных систем (Jira, календарь,
      мессенджер) ограничен политиками безопасности, поэтому подключать источники нужно
      личным токеном пользователя, а интеграция с мессенджером может быть недоступна.
    why: |
      В интервью это не обсуждалось. Вывод сделан из общих представлений о требованиях
      информационной безопасности в банках и из того, что собеседник искал именно API
      интеграции, но так и не автоматизировал сборку. Нужно проверить у Вадима и в ИБ.
