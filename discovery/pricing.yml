# Сравнение с конкурентами (competitors.md): Tempo Timesheets стоит $5,99–10,
# Timesheet Tracking for Jira — от $0,85 за пользователя в месяц, то есть в рублях
# это сотни рублей против наших 2490 ₽. Мы дороже, и это оправдано только тем, что
# решаем другую задачу: они считают списанные часы в одной Jira, мы собираем отчёт
# о сделанном из Jira, git и календаря и ищем пропуски. Нижняя граница коридора
# (2250 ₽) всё равно выше цен плагинов, поэтому цену выбрал у нижней границы.
# Риск: покупателем, скорее всего, будет не разработчик, а работодатель; это
# нужно проверить в разговоре с Вадимом.
